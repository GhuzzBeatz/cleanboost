<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>CleanBoost — Ativação</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:#0a0a0a;color:#f0f0f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#161616;border:1px solid #8b0000;border-radius:18px;padding:40px 44px;max-width:460px;width:100%;box-shadow:0 0 60px rgba(204,0,0,.2);text-align:center}
.icon{font-size:52px;margin-bottom:14px}h1{font-size:22px;font-weight:900;margin-bottom:4px}.h1 span{color:#e60000}
.sub{font-size:13px;color:#555;margin-bottom:28px}
label{display:block;font-size:10px;font-weight:800;color:#555;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;text-align:left}
input{width:100%;background:#111;border:2px solid #2a2a2a;border-radius:10px;padding:13px 16px;color:#f0f0f0;font-size:16px;font-family:monospace;text-transform:uppercase;letter-spacing:2px;text-align:center;outline:none;margin-bottom:14px;transition:border-color .2s}
input:focus{border-color:#cc0000}input.erro{border-color:#ff1a1a}
input.phone{font-family:'Segoe UI',sans-serif;letter-spacing:0;text-align:left;text-transform:none}
button{width:100%;padding:13px;background:linear-gradient(135deg,#8b0000,#cc0000);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;margin-bottom:10px;transition:all .15s}
button:hover{background:linear-gradient(135deg,#cc0000,#ff1a1a);box-shadow:0 4px 20px rgba(204,0,0,.5)}button:disabled{opacity:.72;cursor:wait;box-shadow:none}
.formato{font-size:11px;color:#3a3a3a;margin-bottom:18px}.formato span{font-family:monospace;color:#cc0000;background:rgba(204,0,0,.1);padding:2px 8px;border-radius:4px}
.msg-erro{background:rgba(204,0,0,.1);border:1px solid rgba(204,0,0,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:#ff1a1a;display:none;margin-bottom:10px}
.msg-ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:#22c55e;display:none;margin-bottom:10px}
.device{font-size:11px;color:#555;line-height:1.6;border:1px solid #242424;background:#111;border-radius:8px;padding:9px 11px;margin:6px 0 12px;text-align:left;display:none}
.suporte{font-size:11px;color:#3a3a3a;margin-top:14px;line-height:1.8}.suporte a{color:#cc0000;text-decoration:none}
</style></head><body>
<div class="card">
  <div class="icon"><img src="../logo.png" style="width:80px;height:80px;object-fit:contain;border-radius:16px"></div>
  <h1><span style="color:#e60000">Clean</span>Boost</h1>
  <div class="sub">Limpeza e Otimização de PC</div>
  <label>Chave de Ativação</label>
  <input type="text" id="inputChave" placeholder="CLEAN-XXXX-XXXX-XXXX-XXXX" maxlength="26" autofocus oninput="fmt(this)">
  <div class="formato">Formato: <span>CLEAN-XXXX-XXXX-XXXX-XXXX</span></div>
  <label>WhatsApp para suporte</label>
  <input class="phone" type="tel" id="inputPhone" placeholder="(11) 99999-9999" maxlength="20">
  <div class="device" id="deviceBox">Computador: <span id="dName">-</span><br>Sistema: <span id="dOs">-</span></div>
  <div class="msg-erro" id="msgErro">Chave inválida. Verifique e tente novamente.</div>
  <div class="msg-ok" id="msgOk">Licença ativada! Iniciando...</div>
  <button id="btnAtivar" onclick="ativar()">Ativar Licença</button>
  <div class="suporte">Suporte: <a href="mailto:GHZPLUGIN@GMAIL.COM">GHZPLUGIN@GMAIL.COM</a><br>WhatsApp: (11) 94898-1459</div>
</div>
<script src="../js/licenca.js"></script>
<script>
function fmt(el){let v=el.value.replace(/[^A-Z0-9]/gi,'').toUpperCase();if(v.startsWith('CLEAN')){let rest=v.slice(5),parts=['CLEAN'];for(let i=0;i<rest.length&&parts.length<5;i+=4)parts.push(rest.slice(i,i+4));el.value=parts.join('-')}else{el.value=v};el.classList.remove('erro');document.getElementById('msgErro').style.display='none'}
function mostrarErro(txt){const input=document.getElementById('inputChave');const msg=document.getElementById('msgErro');input.classList.add('erro');msg.textContent=txt;msg.style.display='block';document.getElementById('msgOk').style.display='none'}
async function ativar(){
  const btn=document.getElementById('btnAtivar')
  const chave=document.getElementById('inputChave').value.trim().toUpperCase()
  const phone=document.getElementById('inputPhone').value.trim()
  if(!chave || chave.length<10){mostrarErro('Informe a chave enviada na compra.');return}
  btn.disabled=true
  btn.textContent='Validando...'
  document.getElementById('msgErro').style.display='none'
  try{
    const state=await require('electron').ipcRenderer.invoke('license:get-state')
    const result=state.active&&state.license_key===chave
      ? await ghzLicense.validateOnline()
      : await ghzLicense.activateOnline(chave,phone)
    if(!result?.ok) throw new Error(result?.message||'Chave invalida. Verifique e tente novamente.')
    document.getElementById('msgOk').textContent='Licenca validada. Abrindo o CleanBoost...'
    document.getElementById('msgOk').style.display='block'
    const opened=await ghzLicense.openMainAfterActivation()
    if(!opened?.ok) throw new Error(opened?.message||'Licenca validada, mas nao foi possivel abrir o CleanBoost.')
  }catch(e){
    mostrarErro(e?.message||'Erro de conexao. Verifique sua internet e tente novamente.')
    btn.disabled=false
    btn.textContent='Ativar Licenca'
  }
}
document.getElementById('inputChave').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('inputPhone').focus()})
document.getElementById('inputPhone').addEventListener('keydown',e=>{if(e.key==='Enter')ativar()})
;(async function init(){
  try{
    const { ipcRenderer }=require('electron')
    const [device,state,config]=await Promise.all([
      ipcRenderer.invoke('license:device-info'),
      ipcRenderer.invoke('license:get-state'),
      ipcRenderer.invoke('app:get-config').catch(()=>null)
    ])
    document.getElementById('dName').textContent=device.device_name
    document.getElementById('dOs').textContent=device.device_os
    document.getElementById('deviceBox').style.display='block'
    if(state.license_key){
      document.getElementById('inputChave').value=state.license_key
      if(state.active) document.getElementById('btnAtivar').textContent='Entrar'
    }
    if(config?.version) document.title=`CleanBoost ${config.version} - Ativacao`
  }catch(e){}
})()
</script></body></html>
