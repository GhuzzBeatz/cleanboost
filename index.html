<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CleanBoost</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app-standard.css">
<link rel="stylesheet" href="css/cleanboost-standard.css">
</head>
<body>
<div class="app app-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="standardSidebar">
      <header class="app-brand">
        <img class="brand-banner" id="brandBanner" src="logo.png" alt="" draggable="false">
        <strong class="brand-title" data-app-name>CleanBoost</strong>
        <span class="app-brand-icon" data-app-logo><img src="logo.png" alt="CleanBoost" width="38" height="38"></span>
        <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Recolher menu" aria-expanded="true" aria-controls="standardSidebar" title="Recolher menu"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/></svg></button>
      </header>
      <div class="menu-search">
        <button id="menuSearchFocus" type="button" aria-label="Pesquisar abas" title="Pesquisar abas"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg></button>
        <input id="menuSearch" type="search" placeholder="Pesquisar abas..." aria-label="Pesquisar abas" autocomplete="off" spellcheck="false">
      </div>

    <nav class="sidebar-nav">
      <button class="nav-button nav-btn active" onclick="ir('pages/dashboard.html',this)">
        <span class="nav-icon">🏠</span> Dashboard
      </button>
      <button class="nav-button nav-btn" onclick="ir('pages/limpeza.html',this)">
        <span class="nav-icon">🧹</span> Limpeza
      </button>
      <button class="nav-button nav-btn" onclick="ir('pages/diagnostico.html',this)">
        <span class="nav-icon">🖥️</span> Diagnóstico do PC
      </button>
      <button class="nav-button nav-btn" onclick="ir('pages/inicializacao.html',this)">
        <span class="nav-icon">🚀</span> Inicialização
      </button>
      <button class="nav-button nav-btn" onclick="ir('pages/energia.html',this)">
        <span class="nav-icon">⚡</span> Energia
      </button>
      <button class="nav-button nav-btn" onclick="ir('pages/historico.html',this)">
        <span class="nav-icon">📋</span> Histórico
      </button>
    <p class="menu-search-empty" id="menuSearchEmpty" hidden>Nenhuma aba encontrada.</p>
    </nav>
    <span id="menuSearchStatus" class="sr-only" role="status" aria-live="polite"></span>

    <div class="sidebar-footer menu-footer">
      <div class="menu-window-controls"></div>
      <div class="menu-footer-support"></div>
      <div class="ghz-brand">GHZ Plugin</div>
      <div class="version-txt">CleanBoost v1.0</div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main workspace">
    <div class="topbar">
      <div class="topbar-title" id="topbarTitle">🏠 Dashboard</div>
      <div class="topbar-right">
        <div id="topbarClock" style="font-family:monospace;font-size:13px;color:#555"></div>
      </div>
    </div>
    <div class="page active">
      <iframe id="frame" class="iframe-page" title="Conte?do da aba" src="pages/dashboard.html"></iframe>
    </div>
  </div>

</div>

<script>
const TITULOS = {
  'dashboard.html':     '🏠 Dashboard',
  'limpeza.html':       '🧹 Limpeza do PC',
  'diagnostico.html':   '🖥️ Diagnóstico do PC',
  'inicializacao.html': '🚀 Programas de Inicialização',
  'energia.html':       '⚡ Plano de Energia',
  'historico.html':     '📋 Histórico de Limpezas',
}

function ir(url, btn) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'))
  if (btn) btn.classList.add('active')
  document.getElementById('frame').src = url
  document.getElementById('topbarTitle').textContent = TITULOS[url.split('/').pop()] || url
}

// Relógio
function tick() {
  document.getElementById('topbarClock').textContent =
    new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
}
tick(); setInterval(tick, 1000)
</script>
<script src="js/ghz-support.js" data-target=".menu-footer-support" data-accent="#e60000"></script>
<script src="components/ghz-navigation.js"></script>
<script src="js/standard-theme.js"></script>
<script src="components/ghz-window-bar.js" data-target=".menu-window-controls" data-accent="var(--accent)"></script>
</body>
</html>
