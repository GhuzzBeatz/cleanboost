name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: build-release-cleanboost
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump patch version
        shell: pwsh
        run: |
          npm version patch --no-git-tag-version
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          "APP_VERSION=$($pkg.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build setup (x64)
        run: npm run build:x64 -- --publish never

      - name: Build setup (ia32 / 32-bit)
        run: npm run build:ia32 -- --publish never

      - name: Resolve setup files
        shell: pwsh
        run: |
          $setups = Get-ChildItem dist_installer -File -Recurse |
            Where-Object { $_.Name -like '*Setup*' -and $_.Name -like '*.exe' -and $_.Name -notlike '*.blockmap' }

          if (-not $setups) {
            throw 'Nenhum instalador .exe encontrado em dist_installer.'
          }

          foreach ($arch in @('x64', 'ia32')) {
            if (-not ($setups.Name -like "*$arch*")) {
              throw "Instalador para arquitetura '$arch' nao encontrado em dist_installer."
            }
          }

          $setups | ForEach-Object { Write-Host "Instalador encontrado: $($_.Name)" }

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: CleanBoost v${{ env.APP_VERSION }}
          body: Build automatico - CleanBoost v${{ env.APP_VERSION }} (instaladores de 64 bits e 32 bits)
          files: |
            dist_installer/*Setup*.exe
          overwrite_files: true

      - name: Commit version bump
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore(release): v$env:APP_VERSION [skip ci]"
            git push
          }