name: Contexto_App

on:
  schedule:
    - cron: "30 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contexto-app
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Update context file
        run: node scripts/update-context-codex.mjs

      - name: Commit changes
        id: commit_context
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONTEXTO_CODEX.md
          if git diff --cached --quiet; then
            echo "CONTEXT_STATUS=already_up_to_date" >> "$GITHUB_ENV"
            echo "CONTEXTO_CODEX.md already up to date."
          else
            git commit -m "docs: atualiza CONTEXTO_CODEX semanal"
            git push
            echo "CONTEXT_STATUS=updated" >> "$GITHUB_ENV"
          fi

      - name: Send success email
        if: ${{ success() }}
        shell: bash
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: |
          if [ -z "$SMTP_HOST" ] || [ -z "$SMTP_PORT" ] || [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASS" ] || [ -z "$SMTP_TO" ]; then
            echo "SMTP secrets not configured; skipping email."
            exit 0
          fi

          SUBJECT="[GHZ] Contexto App GitHub - ${GITHUB_REPOSITORY}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          DATE_BR="$(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M:%S')"

          cat > email.txt <<EOF
          From: GHZ GitHub Actions <${SMTP_USER}>
          To: ${SMTP_TO}
          Subject: ${SUBJECT}
          Content-Type: text/plain; charset=UTF-8

          Rotina semanal Contexto App concluida com sucesso.

          Repositorio: ${GITHUB_REPOSITORY}
          Status do Contexto App: ${CONTEXT_STATUS}
          Data/Hora Brasil: ${DATE_BR}
          Workflow: ${GITHUB_WORKFLOW}
          Execucao: ${RUN_URL}

          Se o status for "updated", o arquivo de contexto do app recebeu alteracoes e foi commitado.
          Se o status for "already_up_to_date", o Contexto App ja estava atualizado.
          EOF

          sed -i 's/^          //' email.txt
          curl --fail --show-error --silent \
            --url "smtp://${SMTP_HOST}:${SMTP_PORT}" \
            --ssl-reqd \
            --mail-from "${SMTP_USER}" \
            --mail-rcpt "${SMTP_TO}" \
            --user "${SMTP_USER}:${SMTP_PASS}" \
            --upload-file email.txt

