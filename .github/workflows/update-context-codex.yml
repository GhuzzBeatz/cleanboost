name: Contexto_App

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contexto-app
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Update context file
        run: node scripts/update-context-codex.mjs

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONTEXTO_CODEX.md
          if git diff --cached --quiet; then
            echo "CONTEXTO_CODEX.md already up to date."
          else
            git commit -m "docs: atualiza Contexto App"
            git push
          fi
